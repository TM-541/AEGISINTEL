title: PowerShell Encoded Command
id: 6b1f2a4e-3c5d-4e8f-9a0b-1c2d3e4f5a01
status: experimental
description: >
  Detects powershell.exe launched with an encoded command. Malware staging often does this.
  Some admin tooling also uses it.
author: AEGISINTEL
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\powershell.exe'
  selection_enc:
    CommandLine|contains:
      - ' -EncodedCommand '
      - ' -enc '
      - ' -e '
  filter_deployment_agent:
    ParentImage|endswith: '\ccmexec.exe'
  condition: all of selection_* and not filter_deployment_agent
falsepositives:
  - Software deployment agents that pass encoded scripts
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1027.010
