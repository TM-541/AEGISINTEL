title: Local User Account Created via net.exe
id: 6b1f2a4e-3c5d-4e8f-9a0b-1c2d3e4f5a04
status: experimental
description: Detects creation of a local account using net.exe or net1.exe "user ... /add".
author: AEGISINTEL
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains|all:
      - ' user '
      - '/add'
  condition: selection
falsepositives:
  - IT provisioning scripts
level: high
tags:
  - attack.persistence
  - attack.t1136.001
