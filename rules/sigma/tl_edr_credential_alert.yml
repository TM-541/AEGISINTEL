title: EDR Alert References Credential Dumping or LSASS
id: 6b1f2a4e-3c5d-4e8f-9a0b-1c2d3e4f5a06
status: experimental
description: Promotes third-party EDR alerts that reference credential dumping or LSASS.
author: AEGISINTEL
logsource:
  product: windows
detection:
  selection_alert:
    EventType|startswith: 'alert.'
  selection_terms:
    - Message|contains: 'credential dump'
    - description|contains: 'lsass'
  condition: selection_alert and selection_terms
falsepositives:
  - EDR false positives on legitimate memory diagnostics
level: high
tags:
  - attack.t1003.001
