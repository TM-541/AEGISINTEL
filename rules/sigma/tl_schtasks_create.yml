title: Scheduled Task Created to Run as SYSTEM or at Logon
id: 6b1f2a4e-3c5d-4e8f-9a0b-1c2d3e4f5a03
status: experimental
description: Detects schtasks.exe /create with a SYSTEM principal or an on-logon trigger.
author: AEGISINTEL
logsource:
  product: windows
  category: process_creation
detection:
  selection_create:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  selection_risky:
    - CommandLine|contains: '/ru system'
    - CommandLine|contains: '/sc onlogon'
  condition: selection_create and 1 of selection_risky
falsepositives:
  - Software installers registering update tasks
level: high
tags:
  - attack.persistence
  - attack.t1053.005
