title: Windows Event Log Cleared
id: 6b1f2a4e-3c5d-4e8f-9a0b-1c2d3e4f5a05
status: experimental
description: Detects clearing of Windows event logs via wevtutil or the 1102 audit event.
author: AEGISINTEL
logsource:
  product: windows
detection:
  selection_wevtutil:
    Image|endswith: '\wevtutil.exe'
    CommandLine|re|i: '\s(cl|clear-log)\s'
  selection_1102:
    EventID: 1102
  condition: 1 of selection_*
falsepositives:
  - Administrators intentionally clearing logs on lab systems
level: high
tags:
  - attack.defense-impairment
  - attack.t1685.005
