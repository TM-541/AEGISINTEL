[project]
name = "threatlens"
version = "1.0.0"
description = "AEGISINTEL - Evidence-first threat intelligence. Every verdict, provable. A local-first SOC investigation platform."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Muhammad Talha" }]
keywords = ["soc", "threat-detection", "incident-response", "sigma", "mitre-attack", "streamlit", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Environment :: Web Environment",
]
dependencies = [
    "streamlit>=1.40,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "argon2-cffi>=23.1",
    "httpx>=0.27,<1",
    "PyYAML>=6.0",
    "pandas>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/TM-541/AEGISINTEL"
Issues = "https://github.com/TM-541/AEGISINTEL/issues"

[project.optional-dependencies]
vector = ["chromadb>=0.5,<2"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["threatlens*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "E501"]
"threatlens/ui/**" = ["SIM102"]  # nested `if st.button()` inside permission checks is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running local Ollama and/or Chroma (opt-in: -m integration)",
]
addopts = "-m 'not integration' -q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.setuptools.package-data]
"threatlens.db.migrations" = ["*.sql"]
"threatlens.integrations.data" = ["*.json"]
